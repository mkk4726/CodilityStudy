[project]
name = "codility-study"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "ipykernel>=6.29.0",
    "pytest>=8.0.0",
]

[tool.black]
line-length = 150

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]